{% extends 'base.html' %}

{% block content %}
<h2>Реєстрація</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{form.as_div}}
    <button type="submit" class="btn btn-primary">Зареєструватися</button>
    <a href="{% url 'login' %}" class="btn btn-link">Увійти</a>
</form>
{% endblock %}
