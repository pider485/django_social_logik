{% extends 'base.html' %}

{% block title %} Пост {% endblock %}
{% block content %}
    <a href="{% url 'home' %}" class="btn btn-info">Назад</a>
    <h1>Інформація про пост</h1>
    <p>{{ post.content }}</p>
    {% if post.img %}
        <img src="{{post.img.url}}" alt="">
    {% endif %}
    <p>Автор: {{ post.user.username }}</p>
    <p>Дата створення: {{ post.created_at }}</p>
{% endblock %}
