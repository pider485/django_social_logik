{% extends 'base.html' %}
{% block content %}

{% block title %} Додавання постів {% endblock %}

<form method="POST" action="">
    {% csrf_token %}
    <div class="mb-3">
        <label for="content" class="form-label">Вміст поста</label>
        <textarea class="form-control" id="content" name="content" rows="3"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Додати пост</button
{% endblock %}
